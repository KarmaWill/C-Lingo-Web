<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feedback — C-Lingo</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --bg: #F4FFF5; --ink: #006D50; --accent: #13B982; --surface: #fff; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; font-family: 'DM Sans', sans-serif;
      background: var(--bg); color: #1f2937; display: flex; flex-direction: column; align-items: center;
      padding: 24px;
    }
    a { color: var(--ink); }
    .card {
      width: 100%; max-width: 520px; background: var(--surface); border-radius: 16px;
      padding: 32px; box-shadow: 0 4px 24px rgba(0,109,80,0.08); margin-top: 40px;
    }
    h1 { margin: 0 0 8px; font-size: 1.5rem; color: var(--ink); }
    p.sub { margin: 0 0 24px; color: #6b7280; font-size: 0.95rem; }
    label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 6px; }
    textarea {
      width: 100%; min-height: 160px; padding: 12px 14px; border: 1px solid #e5e7eb;
      border-radius: 10px; font-size: 1rem; margin-bottom: 16px; resize: vertical;
      font-family: inherit;
    }
    button {
      width: 100%; padding: 14px; border: none; border-radius: 10px; font-weight: 700;
      font-size: 1rem; cursor: pointer; background: var(--accent); color: #fff;
    }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .msg { padding: 10px 12px; border-radius: 8px; font-size: 0.9rem; margin-bottom: 16px; }
    .msg.err { background: #fef2f2; color: #b91c1c; }
    .msg.ok { background: #ecfdf5; color: #047857; }
    .warn { background: #fffbeb; color: #92400e; padding: 12px; border-radius: 8px; margin-bottom: 16px; font-size: 0.9rem; }
  </style>
  <script src="js/api-config.js"></script>
  <script src="js/clingo-api.js"></script>
</head>
<body>
  <a href="/">← Back to C-Lingo</a> · <a href="account.html">Account</a>

  <div class="card">
    <h1>Feedback</h1>
    <p class="sub">Help us improve C-Lingo HSK practice and the learning experience.</p>
    <div id="login-warn" class="warn" style="display:none">
      Please <a href="account.html">sign in</a> before submitting feedback.
    </div>
    <div id="message"></div>
    <label for="content">Your message</label>
    <textarea id="content" placeholder="Describe your issue or suggestion…"></textarea>
    <button type="button" id="submit-btn">Submit feedback</button>
  </div>

  <script>
    var msgEl = document.getElementById('message');
    var warnEl = document.getElementById('login-warn');
    var submitBtn = document.getElementById('submit-btn');

    if (!ClingoApi.getToken()) {
      warnEl.style.display = 'block';
      submitBtn.disabled = true;
    }

    function showMsg(text, ok) {
      msgEl.className = 'msg ' + (ok ? 'ok' : 'err');
      msgEl.textContent = text;
    }

    submitBtn.onclick = async function () {
      var content = document.getElementById('content').value.trim();
      if (!content) {
        showMsg('Please enter your feedback.', false);
        return;
      }
      submitBtn.disabled = true;
      try {
        await ClingoApi.submitFeedback(content);
        showMsg('Thank you! Your feedback has been submitted.', true);
        document.getElementById('content').value = '';
      } catch (e) {
        showMsg(e.message || 'Submit failed', false);
      } finally {
        submitBtn.disabled = false;
      }
    };
  </script>
</body>
</html>
